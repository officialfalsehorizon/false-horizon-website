<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FALSE HORIZON — THE LONG WALK</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: #e8e1d2;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 2px solid #d8d0c0;
            border-radius: 50%;
            opacity: 0.12;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: #d8d0c0;
            opacity: 0.15;
            top: 55%;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .sigil {
            font-size: 14px;
            letter-spacing: 8px;
            opacity: 0.65;
            margin-bottom: 35px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 10vw, 90px);
            letter-spacing: 8px;
            font-weight: normal;
            margin-bottom: 18px;
        }

        .subtitle {
            font-size: 15px;
            letter-spacing: 7px;
            margin-bottom: 35px;
            opacity: 0.75;
        }

        .motto {
            color: #7b1e2b;
            font-size: 13px;
            letter-spacing: 5px;
            margin-bottom: 45px;
        }

        .enter {
            display: inline-block;
            border: 1px solid #d8d0c0;
            color: #d8d0c0;
            padding: 15px 30px;
            text-decoration: none;
            letter-spacing: 4px;
            font-size: 12px;
            transition: 0.3s;
        }

        .enter:hover {
            background: #d8d0c0;
            color: #050505;
        }

        .quote {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <main class="hero">

        <div class="content">

            <div class="sigil">◐</div>

            <h1>FALSE HORIZON</h1>

            <div class="subtitle">
                THE LONG WALK
            </div>

            <div class="motto">
                KEEP WALKING. NO EXCUSES.
            </div>

            <a class="enter" href="#">
                ENTER THE WALK
            </a>

        </div>

        <div class="quote">
            SOME ROADS DON'T LEAD ANYWHERE. THEY JUST KEEP YOU WALKING.
        </div>

    </main>

</body>
</html>
